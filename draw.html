<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DreamInk — Студия</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070a1f;color:#fff;font-family:sans-serif;height:100vh;overflow:hidden;display:flex}
.lp{width:210px;background:#10163b;border-right:1px solid #4c1d95;padding:7px;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
.ml{display:flex;align-items:center;justify-content:space-between;background:#192152;padding:5px 8px;border-radius:9px;font-weight:800;font-size:13px;color:#f0abfc}
.bk{background:#6d28d9;border:0;color:#fff;padding:3px 7px;border-radius:6px;font-size:11px;cursor:pointer}
.ww{position:relative;width:136px;height:136px;margin:2px auto;display:flex;align-items:center;justify-content:center}
canvas#cw{border-radius:50%;cursor:crosshair;touch-action:none}
.sv{position:absolute;width:72px;height:72px;border:2px solid #fff;cursor:crosshair;touch-action:none}
.sws{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sw{height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.4);cursor:pointer}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tb{background:#1e2761;border:1px solid #4f46e5;color:#fff;padding:6px 0;border-radius:7px;font-size:14px;cursor:pointer;text-align:center}
.tb.act{background:#ec4899;border-color:#fbcfe8}
.sls{background:#0b102b;padding:5px 7px;border-radius:8px;display:flex;flex-direction:column;gap:4px;font-size:10px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:3px}
.sr input{width:78px;accent-color:#ec4899}
.cp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px;gap:5px;overflow:hidden}
.lb{width:100%;display:flex;align-items:center;gap:6px;background:rgba(16,22,59,.9);padding:4px 8px;border-radius:9px;border:1px solid #6366f1}
.ltb{background:#7c3aed;border:1px solid #f0abfc;color:#fff;padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.eye{cursor:pointer}
.vp{width:100%;flex:1;background:#1e243b;border:2px solid #475569;border-radius:9px;overflow:scroll;display:flex;padding:8px}
.vp::-webkit-scrollbar{width:11px;height:11px}.vp::-webkit-scrollbar-track{background:#334155}.vp::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:5px}
.st{position:relative;width:620px;height:420px;flex-shrink:0;margin:auto;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.st canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.zb{display:flex;align-items:center;gap:8px;background:#10163b;padding:3px 10px;border-radius:9px;border:1px solid #4c1d95;font-size:11px}
.zbt{background:#312e81;border:0;color:#fff;width:24px;height:22px;border-radius:5px;font-weight:800;cursor:pointer}
.rp{width:210px;background:#10163b;border-left:1px solid #4c1d95;padding:7px;display:flex;flex-direction:column;gap:5px;height:100vh}
.ch{font-weight:800;font-size:12px;color:#f0abfc;border-bottom:1px solid #312e81;padding-bottom:3px}
.cf{flex:1;background:#080b21;border-radius:8px;padding:5px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:11px}
.cm{background:#1e2761;padding:4px 6px;border-radius:7px;word-break:break-word}
.cm img{width:48px;height:48px;background:#fff;border-radius:5px;display:block;margin-top:2px}
.sd{display:none;flex-wrap:wrap;gap:4px;max-height:58px;overflow-y:auto;background:#0b102b;padding:4px;border-radius:6px}
.sd img{width:32px;height:32px;background:#fff;border-radius:4px;cursor:pointer}
.ci{display:flex;gap:4px}
.ci input{flex:1;min-width:0;padding:5px;border-radius:6px;border:1px solid #4f46e5;background:#080b21;color:#fff;font-size:11px}
</style>
</head>
<body>
<aside class="lp">
  <div class="ml"><span>🐱 DreamInk</span><button class="bk" onclick="location.href='index.html'">← Меню</button></div>
  <div class="ww"><canvas id="cw" width="136" height="136"></canvas><div class="sv" id="sv"></div></div>
  <div class="sws" id="sws"></div>
  <div class="tg">
    <button class="tb act" id="t-brush" onclick="st('brush')">🖌️</button>
    <button class="tb" id="t-soft" onclick="st('soft')">☁️</button>
    <button class="tb" id="t-mark" onclick="st('mark')">🖍️</button>
    <button class="tb" id="t-spray" onclick="st('spray')">💨</button>
    <button class="tb" id="t-erase" onclick="st('erase')">🧽</button>
    <button class="tb" id="t-pick" onclick="st('pick')">💉</button>
    <button class="tb" id="t-fill" onclick="st('fill')">🪣</button>
    <button class="tb" style="background:#991b1b" onclick="clMy()">🗑️</button>
  </div>
  <div class="sls">
    <div class="sr"><span>Размер:</span><input type="range" id="sz" min="1" max="50" value="8" oninput="g('szv').textContent=this.value"><b id="szv">8</b></div>
    <div class="sr"><span>Прозр.:</span><input type="range" id="al" min="10" max="100" value="100" oninput="g('alv').textContent=this.value+'%'"><b id="alv">100%</b></div>
    <div class="sr"><span>Стабил.:</span><input type="range" id="sb" min="0" max="90" value="40" oninput="g('sbv').textContent=this.value+'%'"><b id="sbv">40%</b></div>
  </div>
</aside>
<main class="cp">
  <div class="lb"><div class="ltb"><span>Холст 1</span><span class="eye" onclick="togEye()">👁️</span></div></div>
  <div class="vp"><div class="st" id="stg"><canvas id="l1" width="620" height="420"></canvas></div></div>
  <div class="zb"><button class="zbt" onclick="zm(-0.2)">-</button><span id="zv">100%</span><button class="zbt" onclick="zm(0.2)">+</button></div>
</main>
<aside class="rp">
  <div class="ch">💬 Чат:</div>
  <div class="cf" id="cf"></div>
  <div class="sd" id="sdr"></div>
  <div class="ci"><button class="tb" style="font-size:12px;padding:5px 7px" onclick="tDr()">🎨</button><input type="text" id="cin" placeholder="Сообщение..." onkeydown="if(event.key=='Enter')sCh()"><button class="tb" style="font-size:12px;padding:5px 8px" onclick="sCh()">➤</button></div>
</aside>
<script>
function g(i){return document.getElementById(i)}
var hue=330,col='#ec4899',cw=g('cw'),cx=cw.getContext('2d');
for(var a=0;a<360;a++){cx.beginPath();cx.moveTo(68,68);cx.arc(68,68,67,(a-1)/57.295,(a+1)/57.295);cx.closePath();cx.fillStyle='hsl('+a+',100%,50%)';cx.fill()}
cx.beginPath();cx.arc(68,68,48,0,6.28);cx.fillStyle='#10163b';cx.fill();
function uSv(){g('sv').style.background='linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl('+hue+',100%,50%))'}uSv();
function sCol(c){col=c;g('sv').style.borderColor=c}
cw.onclick=function(e){var r=cw.getBoundingClientRect(),ang=Math.atan2(e.clientY-r.top-68,e.clientX-r.left-68)/0.01745;if(ang<0)ang+=360;hue=Math.round(ang);uSv();sCol('hsl('+hue+',100%,50%)')};
g('sv').onclick=function(e){var r=this.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));sCol('hsl('+hue+','+Math.round(x/0.01)+'%,'+Math.round(y*(100-x/0.02))+'%)')};
new Array('#ef4444','#f97316','#facc15','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#ffffff','#9ca3af','#4b5563','#000000').forEach(function(c){var d=document.createElement('div');d.className='sw';d.style.background=c;d.onclick=function(){sCol(c)};g('sws').appendChild(d)});
var l1=g('l1'),x1=l1.getContext('2d'),tl='brush',dr=false,sx=0,sy=0;
function togEye(){l1.style.opacity=l1.style.opacity=='0'?'1':'0'}
function clMy(){x1.clearRect(0,0,620,420)}
function st(t){tl=t;document.querySelectorAll('.tg .tb').forEach(function(b){b.classList.remove('act')});if(g('t-'+t))g('t-'+t).classList.add('act')}
function gp(e){var r=l1.getBoundingClientRect(),x=e.touches?e.touches.item(0).clientX:e.clientX,y=e.touches?e.touches.item(0).clientY:e.clientY;return{x:(x-r.left)/(r.width/620),y:(y-r.top)/(r.height/420)}}
l1.onmousedown=l1.ontouchstart=function(e){var p=gp(e);if(tl=='fill'){x1.globalAlpha=g('al').value/100;x1.globalCompositeOperation='source-over';x1.fillStyle=col;x1.fillRect(0,0,620,420);x1.globalAlpha=1;return}if(tl=='pick'){var d=x1.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;if(d.at(3)>0)sCol('rgb('+d.at(0)+','+d.at(1)+','+d.at(2)+')');st('brush');return}dr=true;sx=p.x;sy=p.y};
l1.onmousemove=l1.ontouchmove=function(e){if(!dr)return;e.preventDefault();var p=gp(e),sb=g('sb').value/100,nx=sx+(p.x-sx)-(p.x-sx)/1.3*sb,ny=sy+(p.y-sy)-(p.y-sy)/1.3*sb,sz=g('sz').value,al=g('al').value/100;x1.lineCap='round';x1.lineJoin='round';x1.shadowBlur=0;if(tl=='erase'){x1.globalCompositeOperation='destination-out';x1.globalAlpha=1;x1.lineWidth=sz}else{x1.globalCompositeOperation='source-over';x1.strokeStyle=col;x1.fillStyle=col;if(tl=='spray'){x1.globalAlpha=al/1.6;for(var i=0;i<20;i++)x1.fillRect(nx+(Math.random()-0.5)/0.5*sz,ny+(Math.random()-0.5)/0.5*sz,1.5,1.5);sx=nx;sy=ny;return}if(tl=='soft'){x1.shadowColor=col;x1.shadowBlur=sz/1.1;x1.globalAlpha=al/2.2}else if(tl=='mark'){x1.lineCap='square';x1.globalAlpha=al/1.8}else{x1.globalAlpha=al}x1.lineWidth=sz}x1.beginPath();x1.moveTo(sx,sy);x1.lineTo(nx,ny);x1.stroke();sx=nx;sy=ny};
addEventListener('mouseup',function(){dr=false;x1.globalAlpha=1;x1.shadowBlur=0});addEventListener('touchend',function(){dr=false;x1.globalAlpha=1;x1.shadowBlur=0});
var z=1;function zm(d){z=Math.max(0.6,Math.min(2.2,z+d));g('stg').style.width=Math.round(620*z)+'px';g('stg').style.height=Math.round(420*z)+'px';g('zv').textContent=Math.round(z*100)+'%'}
var bw=new Array('бля','сука','хуй','пизд','еба','секс','порно');
function sCh(){var i=g('cin'),v=i.value.trim();if(!v)return;for(var k=0;k<bw.length;k++){if(v.toLowerCase().indexOf(bw.at(k))!=-1){alert('Запрещены мат и 18+ слова!');return}}var m=document.createElement('div');m.className='cm';m.textContent='🌙 Ты: '+v;g('cf').appendChild(m);i.value='';g('cf').scrollTop=g('cf').scrollHeight}
function tDr(){var d=g('sdr');d.style.display=d.style.display=='flex'?'none':'flex';d.innerHTML='';var r=localStorage.getItem('di_st'),a=r?r.split('|').filter(Boolean):new Array();if(!a.length){d.textContent='Нарисуй смайл в меню!';return}a.forEach(function(u){var im=document.createElement('img');im.src=u;im.onclick=function(){var m=document.createElement('div');m.className='cm';m.textContent='🌙 Ты:';var p=document.createElement('img');p.src=u;m.appendChild(p);g('cf').appendChild(m);g('cf').scrollTop=g('cf').scrollHeight;d.style.display='none'};d.appendChild(im)})}
